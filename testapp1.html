<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmer prototype</title>
<!-- Lets "Add to Home Screen" open Glimmer full-screen with its own name and icon. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glimmer">
<meta name="theme-color" content="#f6f1f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1f3; --surface: #fffbfc; --ink: #2f2236; --ink-soft: #65566b; --field: #8c7a92;
    --hairline: #e6dce2; --plum: #6b3f7d; --plum-deep: #56306a; --plum-tint: #efe6f2;
    --honey: #f0be5a; --honey-tint: #fbefd6; --sage-tint: #e6eee7; --sage-ink: #3f5e4b; --bar: #8a5f9c;
    --sans: "Atkinson Hyperlegible Next", system-ui, sans-serif; --serif: "Literata", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body { margin: 0; font: 16px/1.55 var(--sans); }
  ::selection { background: var(--honey-tint); }
  :focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
  a { color: var(--plum); }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 36px; line-height: 1.2; } h2 { font-size: 24px; } h3 { font-size: 18px; font-family: var(--sans); font-weight: 600; }
  p { margin: 0; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 24px 20px 96px; }
  header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
  .wordmark { display: inline-flex; align-items: center; gap: 8px; font: 600 20px var(--serif); color: var(--ink); text-decoration: none; }
  .spark { width: 10px; height: 10px; border-radius: 50%; background: var(--honey); box-shadow: 0 0 10px 3px rgb(240 190 90 / .55); }
  nav { min-width: 0; max-width: 100%; }
  nav ul { display: flex; gap: 4px; list-style: none; margin: 0 -8px; padding: 0; overflow-x: auto; white-space: nowrap; }
  nav a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 8px; color: var(--ink-soft); text-decoration: none; text-underline-offset: 6px; }
  nav a[aria-current="page"] { color: var(--plum); font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; }
  main { margin-top: 40px; display: flex; flex-direction: column; gap: 40px; }
  .banner { background: var(--honey-tint); border-radius: 12px; padding: 12px 16px; font-size: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 0; font: 600 16px var(--sans); cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--plum); color: #fff; } .btn.primary:hover { background: var(--plum-deep); }
  .btn.secondary { background: var(--plum-tint); color: var(--plum); }
  .btn.quiet { background: none; color: var(--plum); padding: 0 8px; } .btn.quiet:hover { text-decoration: underline; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  input[type=text], input[type=date], input[type=number], select, textarea.in { min-height: 44px; width: 100%; border: 1.5px solid var(--field); border-radius: 10px; background: var(--surface); padding: 8px 12px; font: 16px var(--sans); color: var(--ink); }
  .soft { color: var(--ink-soft); } .small { font-size: 14px; }
  .notice { border-radius: 12px; padding: 12px 16px; background: var(--honey-tint); }
  .notice.ok { background: var(--sage-tint); color: var(--sage-ink); }
  .quote { position: relative; padding: 24px 0; font: 400 30px/1.35 var(--serif); max-width: 36rem; }
  .glow { position: absolute; inset: -40px -32px auto; height: 220px; pointer-events: none;
    background: radial-gradient(60% 50% at 12% 0%, rgb(240 190 90 / .24), transparent 70%); animation: in .6s ease-out both; }
  @keyframes in { from { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .moods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; list-style: none; padding: 0; margin: 20px 0 0; }
  @media (min-width: 560px) { .moods { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 760px) { .moods { grid-template-columns: repeat(4, 1fr); } }
  .chip { width: 100%; min-height: 44px; border: 0; border-radius: 999px; background: var(--surface); padding: 8px 16px; text-align: left; font: 16px var(--sans); color: var(--ink); cursor: pointer; }
  .chip:hover { background: var(--plum-tint); }
  .card { background: var(--sage-tint); border-radius: 24px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--surface); border-radius: 24px; padding: 24px; }
  .list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--hairline); }
  .list > li { border-bottom: 1px solid var(--hairline); }
  .entry-link { display: block; padding: 18px 12px; margin: 0 -12px; border-radius: 12px; color: inherit; text-decoration: none; }
  .entry-link:hover { background: var(--surface); }
  .entry-title { font: 500 21px var(--serif); margin-top: 2px; }
  .excerpt { color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet { position: relative; overflow: hidden; background: var(--surface); margin: 0 -20px; padding: 32px 20px; }
  @media (min-width: 768px) { .sheet { margin: 0; border-radius: 24px; padding: 48px; box-shadow: 0 1px 0 var(--hairline), 0 24px 48px -32px rgb(47 34 54 / .35); } }
  .sheet .glow { inset: 0; height: auto; }
  .sheet-meta { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--ink-soft); align-items: center; }
  .title-in { width: 100%; border: 0; background: transparent; font: 500 36px var(--serif); color: var(--ink); padding: 0; }
  .body-in { width: 100%; max-width: 38rem; border: 0; background: transparent; resize: none; font: 18px/1.75 var(--serif); color: var(--ink); padding: 0; min-height: 12rem; }
  @media (min-width: 768px) { .body-in { font-size: 21px; } }
  .title-in::placeholder, .body-in::placeholder { color: rgb(101 86 107 / .65); }
  .photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; list-style: none; padding: 0; margin: 0; }
  @media (min-width: 560px) { .photos { grid-template-columns: repeat(3, 1fr); } }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
  .bars { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .bars li { display: grid; grid-template-columns: 9.5rem 1fr; gap: 12px; align-items: center; padding: 0 4px; border-radius: 8px; }
  .bars li:hover { background: rgb(230 220 226 / .5); }
  .bar { display: inline-block; height: 16px; background: var(--bar); border-radius: 0 4px 4px 0; vertical-align: middle; margin-right: 8px; }
  .num { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; margin-top: 12px; } td, th { text-align: left; padding: 4px 24px 4px 0; border-bottom: 1px solid var(--hairline); }
  details summary { cursor: pointer; color: var(--plum); }
  fieldset { border: 0; padding: 0; margin: 0; } legend { font-weight: 600; margin-bottom: 4px; }
  .radios { display: flex; flex-wrap: wrap; gap: 4px 20px; } .radios label { display: flex; gap: 8px; align-items: center; min-height: 44px; }
  input[type=radio] { width: 20px; height: 20px; accent-color: var(--plum); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--plum); display: inline-block; animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .3 } }
  audio { width: 100%; }
  label.chip { display: flex; align-items: center; gap: 8px; }
  .chip:has(input:checked) { background: var(--plum); color: #fff; } .chip:has(input:checked) input { accent-color: #fff; }
  .chip input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--plum); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
  .moodrow { display: flex; flex-wrap: wrap; gap: 4px 14px; } .mood { display: inline-flex; align-items: center; gap: 6px; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--plum-tint); color: var(--plum); font-size: 13px; font-weight: 600; vertical-align: middle; }
  .body-text { white-space: pre-wrap; font: 18px/1.75 var(--serif); max-width: 38rem; }
  /* Calendar: kept basic on purpose for now. */
  .cal { width: 100%; max-width: 28rem; table-layout: fixed; margin: 0; }
  .cal th, .cal td { padding: 2px; border: 0; text-align: center; } .cal th { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  .cal a { display: block; height: 40px; line-height: 40px; border-radius: 6px; color: var(--ink); text-decoration: none; }
  .cal a:hover { box-shadow: inset 0 0 0 2px var(--field); } .cal a[aria-current] { font-weight: 700; text-decoration: underline; }
  .cal a.sel { box-shadow: inset 0 0 0 3px var(--ink); }
  .diff { display: grid; gap: 16px; } @media (min-width: 560px) { .diff { grid-template-columns: 1fr 1fr; } }
  .snap { margin: 0; } .snap dt { font-weight: 600; margin-top: 8px; } .snap dd { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="#home"><span class="spark" aria-hidden="true"></span>Glimmer</a>
    <nav aria-label="Main"><ul>
      <li><a href="#home" data-nav="home">Home</a></li>
      <li><a href="#journal" data-nav="journal">Journal</a></li>
      <li><a href="#mood" data-nav="mood">Mood</a></li>
      <li><a href="#goals" data-nav="goals">Goals &amp; worries</a></li>
      <li><a href="#settings" data-nav="settings">Settings</a></li>
    </ul></nav>
  </header>
  <main id="main"></main>
</div>

<script>
// Glimmer prototype: everything is saved in this browser only (localStorage for text,
// IndexedDB for photos and voice notes). No account, no server, nothing is sent anywhere.

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const MOODS = [
  ["joyful","😊","Joyful","#f5c842"],["grateful","🙏","Grateful","#f29e4c"],["calm","😌","Calm","#7cc6e8"],["hopeful","🌱","Hopeful","#86cf7f"],
  ["proud","💪","Proud","#b48ee0"],["okay","😐","Okay","#c9c2b6"],["tired","😴","Tired","#8e9ab0"],["anxious","😟","Anxious","#f08aa0"],
  ["sad","😢","Sad","#5b8fd6"],["angry","😠","Angry","#e0503c"],["overwhelmed","😵‍💫","Overwhelmed","#c07a4a"],["lonely","😔","Lonely","#6d70bd"],
].map(([key, emoji, label, color]) => ({ key, emoji, label, rgb: hex(color) }));

const QUOTES = [
  "Small steps still count as moving.","You don't have to finish everything today.","Some days the win is simply showing up.",
  "Be as patient with yourself as you'd be with a friend.","A quiet moment is still a good moment.","Today is allowed to feel different from yesterday.",
  "You can begin again at any hour.","Notice one thing that went right.","Your pace is still a pace.","It's okay to set something down for a while.",
  "Even cloudy days carry some light.","Write it down, then let it rest.","You are allowed to take up space.","Kindness counts, including toward yourself.",
  "Not every question needs an answer today.","A slow breath is a fine place to start.","Little joys are still joys.","You have made it through hard days before.",
  "Let today be enough as it is.","Progress can be quiet.","Feelings pass through; they don't have to stay.","There's no wrong way to have a day.",
  "Give yourself the credit you'd give anyone else.","The next small thing is all you need to see.","It's fine to want simple things.",
  "Some growth only shows when you look back.","You can hold hope and worry at the same time.","Today's page doesn't need to be perfect.",
  "Thank yourself for the part you already did.","You don't have to carry it all at once.",
];

// ---------- dates (local calendar days) ----------
const pad = (n) => String(n).padStart(2, "0");
const toDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toDay(new Date());
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return toDay(d); };
const addMonth = (s) => { const d = parseDay(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return toDay(d); };
const longDay = (s) => parseDay(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const time = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const quoteFor = (s) => { const [y, m, d] = s.split("-").map(Number); return QUOTES[Math.floor(Date.UTC(y, m - 1, d) / 864e5) % 30]; };
const when = (iso) => `${longDay(toDay(new Date(iso)))} at ${time(iso)}`;
const short = (iso) => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const isDay = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s ?? "") && toDay(parseDay(s)) === s;

// ---------- mood colors ----------
// A mood is stored as its label. Built-in labels match MOODS; anything else is a custom mood.
const findMood = (label) => MOODS.find((m) => m.label.toLowerCase() === label.toLowerCase());
const cleanMood = (s) => { const t = s.trim().replace(/\s+/g, " ").slice(0, 40); return t && (findMood(t)?.label ?? t); };
// Custom moods get a steady color from their name, so "Excited" is always the same shade.
const hashColor = (s) => { let h = 0; for (const c of s.toLowerCase()) h = (h * 31 + c.codePointAt(0)) % 360;
  const l = 0.65, a = 0.55 * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)]; };
const moodInfo = (label) => findMood(label) ?? { label, emoji: "", rgb: hashColor(label) };
// Several moods in one day mix into one color: a plain average of their red, green and blue.
const blend = (labels) => { const cs = labels.map((l) => moodInfo(l).rgb); return [0, 1, 2].map((i) => Math.round(cs.reduce((t, c) => t + c[i], 0) / cs.length)); };
const css = ([r, g, b]) => `rgb(${r} ${g} ${b})`;
const lum = (rgb) => { const [r, g, b] = rgb.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const INK = hex("#2f2236");
const inkOn = (rgb) => { const L = lum(rgb); return (L + 0.05) / (lum(INK) + 0.05) >= 1.05 / (L + 0.05) ? css(INK) : "#fff"; }; // dark or white text, whichever reads better
const moodTag = (label) => { const m = moodInfo(label); return `<span class="mood"><span class="swatch" style="background:${css(m.rgb)}" aria-hidden="true"></span>${m.emoji ? `<span aria-hidden="true">${m.emoji}</span>` : ""}${esc(m.label)}</span>`; };
const moodRow = (labels) => labels.length ? `<p class="moodrow">${labels.map(moodTag).join("")}</p>` : "";

// ---------- storage ----------
const KEY = "glimmer-prototype-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) ?? {}; } catch { return {}; } };
const db = Object.assign({ entries: [], media: [], moods: [], items: [], responses: [] }, load());
// Entries saved before moods and the trash existed: pin their logged time and start empty mood and edit lists.
for (const e of db.entries) {
  if (!e.logged_at) { const t = new Date(e.created_at), d = parseDay(e.entry_date ?? toDay(t)); d.setHours(t.getHours(), t.getMinutes(), t.getSeconds()); e.logged_at = d.toISOString(); delete e.entry_date; }
  e.body ??= ""; e.moods ??= []; e.history ??= []; e.deleted_at ??= null;
}
const persist = () => localStorage.setItem(KEY, JSON.stringify(db));
const uid = () => crypto.randomUUID();
const live = () => db.entries.filter((e) => !e.deleted_at);
const dayOf = (e) => toDay(new Date(e.logged_at));

// Photos and voice notes are too big for localStorage, so they go in IndexedDB.
const idb = new Promise((resolve, reject) => {
  const req = indexedDB.open("glimmer-files", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("files");
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const fileOp = async (mode, fn) => { const d = await idb; return new Promise((res, rej) => {
  const r = fn(d.transaction("files", mode).objectStore("files")); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };
const putFile = (id, blob) => fileOp("readwrite", (s) => s.put(blob, id));
const getFile = (id) => fileOp("readonly", (s) => s.get(id));
const delFile = (id) => fileOp("readwrite", (s) => s.delete(id));

// ---------- tiny helpers ----------
const main = document.getElementById("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root = main) => root.querySelector(sel);
const $$ = (sel, root = main) => [...root.querySelectorAll(sel)];
const urls = [];
const objectUrl = (blob) => { const u = URL.createObjectURL(blob); urls.push(u); return u; };
const fmtDur = (s) => `${Math.floor(Math.round(s) / 60)}:${pad(Math.round(s) % 60)}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const note = (html, ok) => `<p class="notice ${ok ? "ok" : ""}" role="status">${html}</p>`;
let flash = ""; // a notice to show once on the next page, e.g. "Entry saved."
const takeFlash = () => { const f = flash; flash = ""; return f; };

let leaveGuard = null; // set by the editor while changes are unsaved
window.addEventListener("beforeunload", (e) => { if (leaveGuard?.()) e.preventDefault(); });

// ---------- trash ----------
const TRASH_DAYS = 30;
const daysLeft = (e) => Math.ceil((new Date(e.deleted_at).getTime() + TRASH_DAYS * 864e5 - Date.now()) / 864e5);
function removeEntries(list) {
  const ids = new Set(list.map((e) => e.id));
  db.media.filter((m) => ids.has(m.entry_id)).forEach((m) => delFile(m.id).catch(() => {}));
  db.media = db.media.filter((m) => !ids.has(m.entry_id));
  db.entries = db.entries.filter((e) => !ids.has(e.id)); persist();
}
// Anything in the trash for more than 30 days is removed for good. Runs on every page load and page change.
function purgeTrash() {
  const old = db.entries.filter((e) => e.deleted_at && Date.now() - new Date(e.deleted_at).getTime() > TRASH_DAYS * 864e5);
  if (old.length) removeEntries(old);
  return old.length;
}

// ---------- router ----------
let lastPage = null, purged = 0;
function route() {
  urls.splice(0).forEach(URL.revokeObjectURL);
  stopRecording?.();
  const [page, id, sub] = (location.hash.slice(1) || "home").split("/");
  leaveGuard = null;
  purged += purgeTrash();
  const active = page === "entry" || page === "trash" ? "journal" : page;
  $$("[data-nav]", document).forEach((a) => a.dataset.nav === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  ({ home, journal: () => journal(id), entry: () => (id === "new" || sub === "edit" ? editor(id) : view(id)), trash, mood, goals, settings }[page] ?? home)();
  const stay = page === "journal" && lastPage === "journal"; lastPage = page;
  if (stay) $(".cal a.sel")?.focus(); else window.scrollTo(0, 0); // picking a day keeps your place on the calendar
}
window.addEventListener("hashchange", route);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#']");
  if (a && leaveGuard?.() && !confirm("Your latest changes haven't saved yet. Leave anyway?")) e.preventDefault();
}, true);

const banner = `<p class="banner">Prototype: your writing is saved only in this browser on this device. Nothing is sent to a server.</p>`;

// ---------- home ----------
function home() {
  const due = db.items.filter((i) => i.status !== "resolved" && i.follow_up_on && i.follow_up_on <= today());
  main.innerHTML = `
    ${banner}
    <section aria-label="Today's quote" class="quote"><div class="glow" aria-hidden="true"></div><p style="position:relative">${esc(quoteFor(today()))}</p></section>
    <section aria-labelledby="mh"><fieldset><legend><h2 id="mh">How are you feeling right now?</h2><span class="soft" style="font-weight:400">Choose all that apply.</span></legend>
      <ul class="moods">${MOODS.map((m) => `<li><label class="chip"><input type="checkbox" data-mood="${m.key}"><span aria-hidden="true">${m.emoji}</span> ${m.label}</label></li>`).join("")}</ul></fieldset>
      <button class="btn primary" id="checkin" disabled style="margin-top:16px">Save check-in</button>
      <div aria-live="polite" id="moodmsg" style="margin-top:16px"></div>
      <p style="margin-top:12px"><a href="#mood">See your mood history</a></p></section>
    ${due.length ? `<section class="stack" aria-label="Check-ins">${due.map(followUpCard).join("")}</section>` : ""}
    <div class="row"><a class="btn primary" href="#entry/new">Write an entry</a><a href="#journal">Open your journal</a></div>`;
  // Each chosen mood is its own record; moods saved together share one time, so history can group them.
  const picked = () => $$("[data-mood]").filter((c) => c.checked).map((c) => MOODS.find((x) => x.key === c.dataset.mood));
  $$("[data-mood]").forEach((c) => c.onchange = () => { $("#checkin").disabled = !picked().length; $("#moodmsg").innerHTML = ""; });
  $("#checkin").onclick = () => {
    const ms = picked(), at = new Date().toISOString();
    ms.forEach((m) => db.moods.push({ id: uid(), mood_key: m.key, checked_in_at: at })); persist();
    $$("[data-mood]").forEach((c) => c.checked = false); $("#checkin").disabled = true;
    $("#moodmsg").innerHTML = `<p class="notice ok">Saved: ${ms.map((m) => `${m.emoji} ${m.label}`).join(", ")} at ${time(at)}.</p>`;
  };
  $$("[data-answer]").forEach((b) => b.onclick = () => {
    const card = b.closest(".card"); const item = db.items.find((i) => i.id === card.dataset.item);

    db.responses.push({ id: uid(), item_id: item.id, response: answer, note: $("textarea", card).value.trim() || null, created_at: new Date().toISOString() });
    if (answer === "done") item.status = "resolved"; else { item.status = "active"; item.follow_up_on = addDays(today(), 7); }
    persist();

}
function followUpCard(i) {

    <button class="btn secondary" data-answer="better">Better</button><button class="btn secondary" data-answer="done">Done</button></div></article>`;
}

// ---------- journal: calendar and one day ----------
const WEEK = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function journal(arg) {
  const sel = isDay(arg) ? arg : arg ? null : today();
  const month = sel ? sel.slice(0, 7) : /^\d{4}-(0[1-9]|1[0-2])$/.test(arg) ? arg : today().slice(0, 7);
  const [y, m] = month.split("-").map(Number);
  const shift = (n) => toDay(new Date(y, m - 1 + n, 1, 12)).slice(0, 7);
  const byDay = {};
  live().forEach((e) => (byDay[dayOf(e)] ??= []).push(e));
  const cells = [...Array(new Date(y, m - 1, 1).getDay()).fill(""), ...Array.from({ length: new Date(y, m, 0).getDate() }, (_, i) => `${month}-${pad(i + 1)}`)];
  while (cells.length % 7) cells.push("");
  const cell = (d) => {
    if (!d) return "<td></td>";
    const list = byDay[d] ?? [], moods = list.flatMap((e) => e.moods), bg = moods.length ? blend(moods) : null;
    const style = bg ? `background:${css(bg)};color:${inkOn(bg)}` : list.length ? "background:var(--hairline)" : ""; // no entries: plain
    const label = `${longDay(d)}, ${list.length ? `${list.length} ${list.length === 1 ? "entry" : "entries"}${moods.length ? ": " + [...new Set(moods)].join(", ") : ""}` : "no entries"}`;
    return `<td><a href="#journal/${d}"${d === sel ? ' class="sel"' : ""}${d === today() ? ' aria-current="date"' : ""} style="${style}" aria-label="${esc(label)}">${Number(d.slice(8))}</a></td>`;
  };
  const rows = Array.from({ length: cells.length / 7 }, (_, r) => `<tr>${cells.slice(r * 7, r * 7 + 7).map(cell).join("")}</tr>`).join("");
  const used = [...new Set(Object.keys(byDay).filter((d) => d.startsWith(month)).flatMap((d) => byDay[d].flatMap((e) => e.moods)))];
  const inTrash = db.entries.filter((e) => e.deleted_at).length;
  main.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Journal</h1><a href="#trash">Trash${inTrash ? ` (${inTrash})` : ""}</a></div>
    ${takeFlash()}
    <section class="stack" aria-labelledby="calh">
      <div class="row"><a href="#journal/${shift(-1)}">&larr; Previous month</a>
        <h2 id="calh">${parseDay(month + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h2>
        <a href="#journal/${shift(1)}">Next month &rarr;</a>${month !== today().slice(0, 7) ? `<a href="#journal">Back to today</a>` : ""}</div>
      <table class="cal"><thead><tr>${WEEK.map((w) => `<th scope="col">${w}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>
      ${used.length ? `<div class="stack" style="gap:6px">${moodRow(used)}<p class="small soft">Days with more than one mood show a mix of their colors.</p></div>` : ""}
    </section>
    ${sel ? daySection(sel, byDay[sel] ?? []) : `<p class="soft">Choose a day to see its entries.</p>`}`;
}
function daySection(d, list) {
  const future = d > today();
  return `<section class="stack" aria-labelledby="dayh">
    <div class="row" style="justify-content:space-between"><h2 id="dayh">${longDay(d)}</h2>
      ${future ? "" : `<a class="btn primary" href="#entry/new"><span aria-hidden="true">+</span>&nbsp;Add entry</a>`}</div>
    ${!future && d !== today() ? `<p class="small soft">New entries are saved with today's date and the current time.</p>` : ""}
    ${list.length ? `<ul class="list">${list.sort((a, b) => a.logged_at.localeCompare(b.logged_at)).map((e) => `<li><a class="entry-link" href="#entry/${e.id}">
      <span class="small soft">${time(e.logged_at)}</span>${e.history.length ? ` <span class="tag">Edited</span>` : ""}
      <p class="entry-title">${esc(e.title || "Untitled")}</p>${moodRow(e.moods)}${e.body ? `<p class="excerpt">${esc(e.body.slice(0, 160))}</p>` : ""}</a></li>`).join("")}</ul>`
    : `<p class="soft">No entries on this day.</p>`}
  </section>`;
}

// ---------- photos and voice notes (shared by the entry page and the editor) ----------
// Each item is { m, blob? }. Items without a blob are loaded from IndexedDB. Pass onRemove to show remove buttons.
let mediaSeq = 0;
async function showMedia(items, onRemove) {
  const seq = ++mediaSeq;
  const html = await Promise.all(items.map(async ({ m, blob }) => {
    blob ??= await getFile(m.id).catch(() => null); if (!blob) return ["", ""];
    const u = objectUrl(blob), del = onRemove ? `<button class="btn quiet small" data-del="${m.id}" style="align-self:flex-start">Remove ${m.kind === "photo" ? "photo" : "voice note"}</button>` : "";
    return m.kind === "photo" ? [`<li class="stack" style="gap:8px"><a href="${u}" target="_blank"><img src="${u}" alt="Photo added ${new Date(m.created_at).toLocaleDateString()}"></a>${del}</li>`, ""]
      : ["", `<li class="stack" style="gap:8px;padding:12px 0"><p class="small soft">Voice note${m.duration_seconds != null ? ", " + fmtDur(m.duration_seconds) : ""}</p><audio controls src="${u}"></audio>${del}</li>`];
  }));
  if (seq !== mediaSeq || !$("#photolist")) return; // a newer render or another page took over while files loaded
  $("#photolist").innerHTML = html.map((h) => h[0]).join(""); $("#voicelist").innerHTML = html.map((h) => h[1]).join("");
  if (onRemove) $$("[data-del]").forEach((b) => b.onclick = () => onRemove(b.dataset.del));
}

// ---------- one entry ----------
const snap = (title, body, moods, media) => ({ title, body, moods: [...moods], media: media.map((m) => ({ id: m.id, kind: m.kind })) });
function snapHtml(s, other) {
  const changed = (k) => JSON.stringify(s[k]) !== JSON.stringify(other[k]) ? ` <span class="tag">Changed</span>` : "";
  const count = (k) => s.media.filter((m) => m.kind === k).length;
  return `<dl class="snap"><dt>Title${changed("title")}</dt><dd>${esc(s.title || "Untitled")}</dd>
    <dt>Moods${changed("moods")}</dt><dd>${s.moods.length ? esc(s.moods.join(", ")) : "None"}</dd>
    <dt>Description${changed("body")}</dt><dd style="white-space:pre-wrap">${s.body ? esc(s.body) : "(empty)"}</dd>
    <dt>Photos and voice notes${changed("media")}</dt><dd>${plural(count("photo"), "photo")}, ${plural(count("voice"), "voice note")}</dd></dl>`;
}
function view(id) {
  const e = db.entries.find((x) => x.id === id);
  if (!e) { main.innerHTML = `<h1>This entry isn't here</h1><p class="soft">It may have been permanently deleted.</p><a href="#journal">Back to journal</a>`; return; }
  const d = dayOf(e), mine = db.media.filter((m) => m.entry_id === e.id);
  main.innerHTML = `<a href="${e.deleted_at ? "#trash" : `#journal/${d}`}" style="align-self:flex-start">${e.deleted_at ? "Back to trash" : `Back to ${longDay(d)}`}</a>
    ${takeFlash()}
    ${e.deleted_at ? note(`This entry is in the trash. It will be permanently deleted ${daysLeft(e) <= 1 ? "within a day" : `in ${daysLeft(e)} days`} unless you restore it.`) : ""}
    <article class="sheet"><div class="glow" aria-hidden="true"></div>
      <div class="sheet-meta"><p>${when(e.logged_at)}</p>${e.history.length ? `<span class="tag">Edited</span>` : ""}</div>
      <div style="position:relative;margin-top:24px" class="stack">
        <h1>${esc(e.title || "Untitled")}</h1>${moodRow(e.moods)}
        ${e.body ? `<p class="body-text">${esc(e.body)}</p>` : ""}
        ${mine.length ? `<ul class="photos" id="photolist"></ul><ul class="list" id="voicelist" style="border-top:0"></ul>` : ""}
      </div>
    </article>
    <div class="row">${e.deleted_at ? `<button class="btn primary" id="restore">Restore entry</button>`
      : `<a class="btn primary" href="#entry/${e.id}/edit">Edit entry</a><button class="btn secondary" id="totrash">Move to trash</button>`}</div>
    ${e.history.length ? `<section class="stack" aria-labelledby="histh"><h2 id="histh">Edit history</h2>
      <ul class="list">${[...e.history].reverse().map((h) => `<li class="stack" style="gap:12px;padding:18px 0"><h3>Edited ${short(h.edited_at)}</h3>
        <div class="diff"><div><p class="small soft">Before</p>${snapHtml(h.before, h.after)}</div><div><p class="small soft">After</p>${snapHtml(h.after, h.before)}</div></div></li>`).join("")}</ul></section>` : ""}`;
  if (mine.length) showMedia(mine.map((m) => ({ m })));
  if (e.deleted_at) $("#restore").onclick = () => { e.deleted_at = null; persist(); flash = note("Restored. It's back in your journal.", true); view(id); };
  else $("#totrash").onclick = () => {
    e.deleted_at = new Date().toISOString(); persist();
    flash = note(`Moved to the trash. You can restore it from the <a href="#trash">trash</a> for ${TRASH_DAYS} days.`, true);
    location.hash = `#journal/${d}`;
  };
}

// ---------- entry editor (new entries and edits follow the same rules) ----------
let stopRecording = null, finishRecording = null;
function editor(id) {
  const current = id === "new" ? null : db.entries.find((e) => e.id === id);
  if (current === undefined) { main.innerHTML = `<h1>This entry isn't here</h1><a href="#journal">Back to journal</a>`; return; }
  if (current?.deleted_at) return view(id); // restore it before editing
  const loggedAt = current?.logged_at ?? new Date().toISOString(); // set by the device, never editable
  const saved = current ? db.media.filter((m) => m.entry_id === current.id) : [];
  const draft = { title: current?.title ?? "", body: current?.body ?? "", moods: [...(current?.moods ?? [])] };
  const pending = [], removed = new Set(); // photo and voice note changes wait here until you save
  let dirty = false, saving = false;
  leaveGuard = () => dirty;
  const touch = () => { dirty = true; };
  // Mood choices: the built-in list, then custom moods (yours from other entries and any added here), A to Z.
  const customs = [];
  const addOption = (l) => { if (!findMood(l) && !customs.some((c) => c.toLowerCase() === l.toLowerCase())) { customs.push(l); customs.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" })); } };
  [...live().flatMap((e) => e.moods), ...draft.moods].forEach(addOption);
  const options = () => [...MOODS.map((m) => m.label), ...customs];
  const has = (l) => draft.moods.some((x) => x.toLowerCase() === l.toLowerCase());
  const back = current ? `#entry/${current.id}` : "#journal";

  main.innerHTML = `<a href="${back}" style="align-self:flex-start">${current ? "Back to entry" : "Back to journal"}</a>
    <article class="sheet"><div class="glow" aria-hidden="true"></div>
      <div class="sheet-meta"><p><b>${when(loggedAt)}</b><br>Date and time are set automatically and can't be changed.</p>${current?.history.length ? `<span class="tag">Edited</span>` : ""}</div>
      <div style="position:relative;margin-top:32px" class="stack">
        <label class="small soft" for="title">Title (optional)</label><input id="title" class="title-in" maxlength="200" placeholder="Untitled" value="${esc(draft.title)}">
        <label class="small soft" for="body" style="margin-top:12px">Description (required)</label><textarea id="body" class="body-in" placeholder="What's on your mind today?">${esc(draft.body)}</textarea>
        <fieldset style="margin-top:24px"><legend>How are you feeling? (required) <span class="soft" style="font-weight:400">Choose all that apply.</span></legend>
          <ul class="moods" id="moodlist"></ul>
          <div class="row" style="margin-top:12px;align-items:flex-end"><label class="f" style="flex:1 1 14rem">Or type your own mood<input type="text" id="custom" maxlength="40" autocomplete="off"></label>
            <button class="btn secondary" id="addcustom">Add mood</button></div>
        </fieldset>
      </div>
      <section style="position:relative;margin-top:40px;padding-top:32px;border-top:1px solid var(--hairline)" class="stack" aria-labelledby="medh">
        <h2 id="medh">Photos and voice notes</h2>
        <p class="small soft">Optional. Changes here are kept when you save the entry.</p>
        <div id="medmsg" aria-live="polite"></div>
        <label class="f">Add photos<span class="small soft" style="font-weight:400">JPG, PNG, or WebP, up to 10 MB each.</span>
          <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple></label>
        <ul class="photos" id="photolist"></ul>
        <div id="recorder"></div>
        <label class="f">Or upload an audio file<span class="small soft" style="font-weight:400">Up to 5 minutes and 20 MB.</span>
          <input type="file" id="audiofile" accept=".m4a,.mp3,.wav,.ogg,.webm,.aac,audio/mp4,audio/x-m4a,audio/mpeg,audio/wav,audio/ogg,audio/webm,audio/aac"></label>
        <ul class="list" id="voicelist" style="border-top:0"></ul>
      </section>
    </article>
    <div id="err" aria-live="polite"></div>
    <div class="row"><button class="btn primary" id="save">${current ? "Save changes" : "Save entry"}</button><a href="${back}">Cancel</a></div>`;

  const body = $("#body");
  const grow = () => { body.style.height = "auto"; body.style.height = body.scrollHeight + "px"; };
  grow();
  $("#title").oninput = (e) => { draft.title = e.target.value; touch(); };
  body.oninput = (e) => { draft.body = e.target.value; touch(); grow(); };

  function renderMoods() {
    $("#moodlist").innerHTML = options().map((l) => { const m = moodInfo(l);
      return `<li><label class="chip"><input type="checkbox" value="${esc(m.label)}"${has(l) ? " checked" : ""}><span class="swatch" style="background:${css(m.rgb)}" aria-hidden="true"></span>${m.emoji ? `<span aria-hidden="true">${m.emoji}</span>` : ""}${esc(m.label)}</label></li>`; }).join("");
    $$("#moodlist input").forEach((c) => c.onchange = () => {
      draft.moods = c.checked ? [...draft.moods, c.value] : draft.moods.filter((x) => x.toLowerCase() !== c.value.toLowerCase()); touch();
    });
  }
  const addCustom = () => {
    const l = cleanMood($("#custom").value); $("#custom").value = ""; if (!l) return;
    addOption(l); if (!has(l)) draft.moods.push(l); touch(); renderMoods();
  };
  renderMoods();
  $("#addcustom").onclick = addCustom;
  $("#custom").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(); } };

  $("#save").onclick = async () => {
    if (saving) return;
    saving = true; await finishRecording?.(); saving = false; // a recording still going is stopped and added first
    if ($("#custom").value.trim()) addCustom(); // a typed mood counts even if you didn't press Add
    const text = draft.body.trim(), moods = options().filter(has), problems = [];
    if (!text) problems.push("Write a description.");
    if (!moods.length) problems.push("Choose at least one mood, or type your own.");
    if (problems.length) {
      $("#err").innerHTML = note(`${current ? "Your changes can't be saved yet." : "This entry can't be saved yet."} ${problems.join(" ")}`);
      (text ? $("#moodlist input") : body).focus(); return;
    }
    const keep = [...saved.filter((m) => !removed.has(m.id)), ...pending.map((p) => p.m)];
    const before = current && snap(current.title ?? null, current.body, current.moods, saved), after = snap(draft.title.trim() || null, text, moods, keep);
    if (current && JSON.stringify(before) === JSON.stringify(after)) { dirty = false; flash = note("Nothing changed, so there was nothing new to save.", true); location.hash = back; return; }
    saving = true; $("#save").disabled = true;
    try { for (const p of pending) await putFile(p.m.id, p.blob); }
    catch { saving = false; $("#save").disabled = false; $("#err").innerHTML = note("Your photos or voice notes couldn't be saved. Your browser may be out of space. Try removing one and saving again."); return; }
    removed.forEach((mid) => delFile(mid).catch(() => {}));
    const now = new Date().toISOString();
    let entry = current;
    if (!entry) { entry = { id: uid(), logged_at: loggedAt, created_at: now, history: [], deleted_at: null }; db.entries.push(entry); }
    else entry.history.push({ edited_at: now, before, after }); // every edit keeps a full before-and-after copy
    Object.assign(entry, { title: after.title, body: text, moods, updated_at: now });
    pending.forEach((p) => p.m.entry_id = entry.id);
    db.media = [...db.media.filter((m) => !removed.has(m.id)), ...pending.map((p) => p.m)];
    persist(); dirty = false;
    flash = note(current ? "Changes saved." : "Entry saved.", true);
    location.hash = current ? `#entry/${entry.id}` : `#journal/${dayOf(entry)}`;
  };

  const msg = (text, ok) => { $("#medmsg").innerHTML = text ? `<p class="notice ${ok ? "ok" : ""}">${esc(text)}</p>` : ""; };
  const renderMedia = () => showMedia([...saved.filter((m) => !removed.has(m.id)).map((m) => ({ m })), ...pending], (mid) => {
    const i = pending.findIndex((p) => p.m.id === mid); if (i >= 0) pending.splice(i, 1); else removed.add(mid); touch(); renderMedia();
  });
  const stage = (kind, blob, seconds) => {
    pending.push({ blob, m: { id: uid(), entry_id: null, kind, mime_type: blob.type.split(";")[0], size_bytes: blob.size,
      duration_seconds: seconds == null ? null : Math.ceil(seconds), created_at: new Date().toISOString() } });
    touch(); renderMedia();
  };
  renderMedia();

  $("#photos").onchange = (e) => {
    msg("");
    for (const f of e.target.files) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(f.type)) { msg(`${f.name} isn't a JPG, PNG, or WebP photo.`); continue; }
      if (f.size > 10 * 1024 * 1024) { msg(`That photo is ${(f.size / 1048576).toFixed(1)} MB. Photos can be up to 10 MB.`); continue; }
      stage("photo", f, null);
    }
    e.target.value = "";
  };
  $("#audiofile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; msg("");
    if (f.size > 20 * 1024 * 1024) { msg(`That recording is ${(f.size / 1048576).toFixed(1)} MB. Voice notes can be up to 20 MB.`); e.target.value = ""; return; }
    const seconds = await new Promise((res) => { const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = () => res(isFinite(a.duration) ? a.duration : null); a.onerror = () => res(null); a.src = objectUrl(f); });
    if (seconds != null && seconds > 300) msg("That recording is longer than 5 minutes. Voice notes can be up to 5 minutes.");
    else { stage("voice", f, seconds); msg("Voice note added. It's kept when you save the entry.", true); }
    e.target.value = "";
  };
  recorder($("#recorder"), (blob, s) => { stage("voice", blob, s); msg("Voice note added. It's kept when you save the entry.", true); }, msg);
}

// ---------- trash page ----------
function trash() {
  const gone = purged; purged = 0;
  const list = db.entries.filter((e) => e.deleted_at).sort((a, b) => b.deleted_at.localeCompare(a.deleted_at));
  main.innerHTML = `<a href="#journal" style="align-self:flex-start">Back to journal</a>
    <div><h1>Trash</h1><p class="soft" style="margin-top:8px">Deleted entries stay here for ${TRASH_DAYS} days. Restoring one brings it back with its original date and edit history. After ${TRASH_DAYS} days it's permanently deleted.</p></div>
    ${takeFlash()}
    ${gone ? note(`${gone === 1 ? "1 entry was" : `${gone} entries were`} in the trash for more than ${TRASH_DAYS} days and ${gone === 1 ? "has" : "have"} been permanently deleted.`) : ""}
    ${list.length ? `<ul class="list">${list.map((e) => { const n = daysLeft(e); return `<li class="stack" style="gap:8px;padding:18px 0" data-id="${e.id}">
      <p class="small soft">Written ${when(e.logged_at)} · Deleted ${short(e.deleted_at)} · ${n <= 1 ? "Permanently deleted within a day" : `${n} days left`}</p>
      <p class="entry-title">${esc(e.title || "Untitled")}</p>${moodRow(e.moods)}${e.body ? `<p class="excerpt">${esc(e.body.slice(0, 160))}</p>` : ""}
      <div class="row" style="gap:4px"><button class="btn secondary" data-act="restore">Restore</button><a class="btn quiet" href="#entry/${e.id}">View</a><button class="btn quiet" data-act="forever">Delete forever</button></div></li>`; }).join("")}</ul>
    <details class="small"><summary>Testing tools</summary>
      <div class="stack" style="margin-top:12px"><p>Pretend an entry was deleted some days ago. Anything in the trash for more than ${TRASH_DAYS} days is permanently deleted right away.</p>
        <label class="f">Entry<select id="agepick">${list.map((e) => `<option value="${e.id}">${esc(e.title || "Untitled")}, written ${esc(short(e.logged_at))}</option>`).join("")}</select></label>
        <label class="f">Deleted how many days ago?<input type="number" id="agedays" min="0" max="365" value="31"></label>
        <button class="btn secondary" id="age" style="align-self:flex-start">Change deleted date</button></div></details>`
    : `<div><p style="font:500 24px var(--serif)">The trash is empty</p><p class="soft" style="margin-top:8px">Entries you move to the trash show up here.</p></div>`}`;
  $$("[data-act]").forEach((b) => b.onclick = () => {
    const e = db.entries.find((x) => x.id === b.closest("li").dataset.id);
    if (b.dataset.act === "restore") { e.deleted_at = null; persist(); flash = note(`Restored. It's back on <a href="#journal/${dayOf(e)}">${longDay(dayOf(e))}</a>.`, true); return trash(); }
    if (confirm("Permanently delete this entry, its photos and voice notes, and its edit history? This can't be undone.")) { removeEntries([e]); trash(); }
  });
  $("#age") && ($("#age").onclick = () => {
    const e = db.entries.find((x) => x.id === $("#agepick").value), days = Number($("#agedays").value);
    if (!e || !(days >= 0)) return;
    e.deleted_at = new Date(Date.now() - days * 864e5).toISOString(); persist();
    purged += purgeTrash(); trash();
  });
}

// ---------- voice recorder (MediaRecorder) ----------
// A recording is added to the entry as soon as it stops, so it can't be left behind when the entry is saved.
const TYPES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/ogg;codecs=opus"];
function recorder(el, onSave, msg) {
  let stream, rec, started, tick, done;
  const idle = () => { el.innerHTML = `<button class="btn secondary">Record a voice note</button><span class="sr" aria-live="polite" id="recsr"></span>`; el.firstChild.onclick = start; };
  stopRecording = () => { clearInterval(tick); stream?.getTracks().forEach((t) => t.stop()); if (rec?.state === "recording") { rec.onstop = null; rec.stop(); } };
  finishRecording = () => rec?.state === "recording" ? new Promise((res) => { done = res; rec.stop(); }) : Promise.resolve();
  async function start() {
    msg("");
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { msg("This browser can't record audio here. You can upload an audio file instead. (Recording needs https:// or a local file.)"); return; }
    el.innerHTML = `<button class="btn secondary" disabled>Waiting for microphone…</button>`;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) {
      idle();
      msg(err.name === "NotAllowedError" ? "Glimmer can't use your microphone right now. You can allow it in your browser settings, or upload an audio file instead."
        : err.name === "NotFoundError" ? "No microphone was found. You can upload an audio file instead."
        : "The microphone couldn't start. It may be in use by another app. You can upload an audio file instead.");
      return;
    }
    const type = TYPES.find((t) => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      clearInterval(tick); stream.getTracks().forEach((t) => t.stop());
      const seconds = Math.min(300, (Date.now() - started) / 1000);
      onSave(new Blob(chunks, { type: (rec.mimeType || type || "audio/webm").split(";")[0] }), seconds);
      if (seconds >= 300) msg("Recordings stop at 5 minutes. This one was added, and you can record another.", true);
      idle(); done?.(); done = null;
    };
    started = Date.now(); rec.start(1000);
    el.innerHTML = `<div class="row"><span class="sr" aria-live="polite">Recording started</span><span><span class="rec-dot" aria-hidden="true"></span> <b>Recording</b> <span id="clock" style="font-variant-numeric:tabular-nums">0:00</span> <span class="small soft">of 5:00</span></span><button class="btn primary" id="rstop">Stop</button></div>`;
    $("#rstop", el).onclick = () => rec.stop();
    tick = setInterval(() => {
      const s = (Date.now() - started) / 1000; $("#clock", el).textContent = fmtDur(s);
      if (s >= 300) { clearInterval(tick); rec.stop(); }
    }, 250);
  }
  idle();
}

// ---------- mood ----------
function mood() {
  leaveGuard = null;
  const since = Date.now() - 30 * 864e5;
  const recent = db.moods.filter((m) => new Date(m.checked_in_at).getTime() >= since);
  const counts = MOODS.map((m) => ({ m, n: recent.filter((c) => c.mood_key === m.key).length }));
  const max = Math.max(1, ...counts.map((c) => c.n));
  const byDay = {};
  [...db.moods].sort((a, b) => b.checked_in_at.localeCompare(a.checked_in_at))
    .forEach((c) => { const day = (byDay[toDay(new Date(c.checked_in_at))] ??= []), last = day.at(-1);
      if (last?.at === c.checked_in_at) last.ms.push(c.mood_key); else day.push({ at: c.checked_in_at, ms: [c.mood_key] }); });
  main.innerHTML = `<h1>Mood</h1>${!db.moods.length ? `<div><p style="font:500 24px var(--serif)">No check-ins yet</p><p class="soft" style="margin-top:8px">You can check in from the <a href="#home">home page</a> whenever you like.</p></div>` : `
    <figure class="stack" style="margin:0"><figcaption><h2>Your check-ins, last 30 days</h2></figcaption>
      <ul class="bars">${counts.map(({ m, n }) => `<li><span><span aria-hidden="true">${m.emoji}</span> ${m.label}<span class="sr">, ${n} check-ins</span></span>
        <span aria-hidden="true">${n ? `<span class="bar" style="width:${(n / max) * 80}%"></span>` : ""}<span class="num">${n}</span></span></li>`).join("")}</ul>
      <details><summary>Show as a table</summary><table><tr><th>Mood</th><th>Check-ins</th></tr>${counts.map(({ m, n }) => `<tr><td>${m.label}</td><td>${n}</td></tr>`).join("")}</table></details>
    </figure>
    <section class="stack"><h2>By day</h2>${Object.entries(byDay).map(([day, list]) => `<div><h3>${longDay(day)}</h3>
      <ul style="list-style:none;padding:0;margin:8px 0 0">${list.map((c) => `<li style="display:flex;gap:16px"><span class="soft" style="width:5rem;flex:none;font-variant-numeric:tabular-nums">${time(c.at)}</span><span>${c.ms.map((k) => {
        const m = MOODS.find((x) => x.key === k); return `<span aria-hidden="true">${m.emoji}</span> ${m.label}`; }).join(", ")}</span></li>`).join("")}</ul></div>`).join("")}
    </section>`}`;
}

// ---------- goals & worries ----------
function followPicker(name) {
  return `<fieldset><legend>When should Glimmer check in?</legend><div class="radios">
    ${[["tomorrow", "Tomorrow"], ["week", "In a week"], ["month", "In a month"], ["date", "Pick a date"]].map(([v, l]) =>
      `<label><input type="radio" name="${name}" value="${v}" ${v === "week" ? "checked" : ""}> ${l}</label>`).join("")}</div>
    <input type="date" data-pick="${name}" min="${today()}" hidden style="max-width:16rem;margin-top:8px" aria-label="Date"></fieldset>`;
}
function pickedDate(root, name) {
  const v = $(`input[name="${name}"]:checked`, root).value;
  return v === "tomorrow" ? addDays(today(), 1) : v === "week" ? addDays(today(), 7) : v === "month" ? addMonth(today()) : $(`[data-pick="${name}"]`, root).value || null;
}
function wirePicker(root, name) {
  $$(`input[name="${name}"]`, root).forEach((r) => r.onchange = () => $(`[data-pick="${name}"]`, root).hidden = r.value !== "date" || !r.checked);
}
function goals() {
  leaveGuard = null;
  const open = db.items.filter((i) => i.status !== "resolved").sort((a, b) => (a.follow_up_on ?? "").localeCompare(b.follow_up_on ?? ""));
  const resolved = db.items.filter((i) => i.status === "resolved");
  const row = (i) => `<li class="stack" style="gap:8px;padding:18px 0" data-id="${i.id}"><p style="font:18px var(--serif)">${esc(i.text)}</p>
    ${i.status !== "resolved" ? `<p class="small soft">${i.status === "postponed" ? "Postponed to" : "Next check-in:"} ${longDay(i.follow_up_on)}</p>` : ""}
    <div class="row" style="gap:4px">${i.status !== "resolved" ? `<button class="btn quiet" data-act="edit">Edit</button><button class="btn quiet" data-act="postpone">Postpone</button><button class="btn quiet" data-act="resolve">Mark resolved</button>` : ""}
    <button class="btn quiet" data-act="delete">Delete</button></div></li>`;
  const section = (title, list) => list.length ? `<section><h2>${title}</h2><ul class="list" style="border-top:0">${list.map(row).join("")}</ul></section>` : "";
  main.innerHTML = `<div><h1>Goals &amp; worries</h1><p class="soft" style="margin-top:8px">Glimmer checks in on the day you choose, right on your home page.</p></div>
    <form class="panel stack" id="add"><h2>Add something</h2>
      <fieldset><legend>Is it a goal or a worry?</legend><div class="radios"><label><input type="radio" name="kind" value="goal" checked> Goal</label><label><input type="radio" name="kind" value="worry"> Worry</label></div></fieldset>
      <label class="f">What is it?<textarea class="in" name="text" rows="2" maxlength="500" required></textarea></label>
      ${followPicker("add-fu")}<div id="addmsg"></div><button class="btn primary" style="align-self:flex-start">Add to my list</button></form>
    ${db.items.length ? "" : `<div><p style="font:500 24px var(--serif)">Nothing on your list yet</p><p class="soft" style="margin-top:8px">Add a goal you're working toward or a worry you'd like to check in on later.</p></div>`}
    ${section("Goals", open.filter((i) => i.kind === "goal"))}${section("Worries", open.filter((i) => i.kind === "worry"))}
    ${resolved.length ? `<details><summary><b>Resolved (${resolved.length})</b></summary><ul class="list" style="border-top:0">${resolved.map(row).join("")}</ul></details>` : ""}`;
  const form = $("#add"); wirePicker(form, "add-fu");
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = form.text.value.trim(), date = pickedDate(form, "add-fu");
    if (!text) return;
    if (!date) { $("#addmsg").innerHTML = `<p class="notice">Choose a date for the check-in.</p>`; return; }
    db.items.push({ id: uid(), kind: form.kind.value, text, status: "active", follow_up_on: date, created_at: new Date().toISOString() });
    persist(); goals();
  };
  $$("[data-act]").forEach((b) => b.onclick = () => {
    const li = b.closest("li"), item = db.items.find((i) => i.id === li.dataset.id), act = b.dataset.act;
    if (act === "resolve") { item.status = "resolved"; persist(); return goals(); }
    if (act === "delete") { if (confirm("Delete this item? This can't be undone.")) { db.items = db.items.filter((i) => i !== item); db.responses = db.responses.filter((r) => r.item_id !== item.id); persist(); goals(); } return; }
    const name = "fu-" + item.id;
    li.innerHTML = `${act === "edit" ? `<label class="f">What is it?<textarea class="in" rows="2" maxlength="500">${esc(item.text)}</textarea></label>` : `<p style="font:18px var(--serif)">${esc(item.text)}</p>`}
      ${followPicker(name)}<div class="row"><button class="btn primary" data-save>${act === "edit" ? "Save changes" : "Postpone"}</button><button class="btn quiet" data-cancel>Cancel</button></div>`;
    wirePicker(li, name);
    $("[data-cancel]", li).onclick = goals;
    $("[data-save]", li).onclick = () => {
      const date = pickedDate(li, name); if (!date) return;
      if (act === "edit") { const t = $("textarea", li).value.trim(); if (!t) return; item.text = t; } else item.status = "postponed";
      item.follow_up_on = date; persist(); goals();
    };
  });
}

// ---------- settings ----------
function settings() {
  leaveGuard = null;
  main.innerHTML = `<h1>Settings</h1>
    <section class="stack"><h2>Download your data</h2><p>A JSON file with your entries, mood check-ins, goals and worries, and follow-up notes. Photos and voice notes stay in the browser.</p>
      <button class="btn secondary" id="dl" style="align-self:flex-start">Download my data</button></section>
    <section class="stack" style="border-top:1px solid var(--hairline);padding-top:40px"><h2>Delete everything</h2>
      <p>This removes all of your entries, photos, voice notes, mood check-ins, goals and worries from this browser. It can't be undone.</p>
      <label class="f">Type "delete my data" to confirm<input type="text" id="confirm" autocomplete="off"></label>
      <button class="btn secondary" id="wipe" disabled style="align-self:flex-start">Delete my data</button></section>`;
  $("#dl").onclick = () => {
    const data = { exported_at: new Date().toISOString(), entries: db.entries.map((e) => ({ ...e, media: db.media.filter((m) => m.entry_id === e.id) })),
      mood_checkins: db.moods, goals_worries: db.items.map((i) => ({ ...i, follow_up_responses: db.responses.filter((r) => r.item_id === i.id) })) };
    const a = Object.assign(document.createElement("a"), { href: objectUrl(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })), download: `glimmer-data-${today()}.json` });
    a.click();
  };
  $("#confirm").oninput = (e) => $("#wipe").disabled = e.target.value.trim().toLowerCase() !== "delete my data";
  $("#wipe").onclick = async () => {
    for (const m of db.media) await delFile(m.id).catch(() => {});
    localStorage.removeItem(KEY); Object.assign(db, { entries: [], media: [], moods: [], items: [], responses: [] });
    main.innerHTML = `<p class="notice ok">Everything has been deleted from this browser.</p><a href="#home">Go home</a>`;
  };
}

route();
</script>
