  if (!e) { main.innerHTML = `<h1>This entry isn't here</h1><p class="soft">It may have been permanently deleted.</p><a class="btn secondary" href="#journal" style="align-self:flex-start">Back to journal</a>`; return; }
  const d = dayOf(e), mine = db.media.filter((m) => m.entry_id === e.id);
  // Edit lives in the top bar, where it stays in reach as you scroll a long entry.
  main.innerHTML = `${e.deleted_at ? backBar("#trash", "Trash") : backBar(`#journal/${d}`, nums(longDay(d)), `<a class="textbtn" href="#entry/${e.id}/edit">Edit</a>`)}
    ${takeFlash()}
    ${e.deleted_at ? note(nums(`This entry is in the trash. It will be permanently deleted ${daysLeft(e) <= 1 ? "within a day" : `in ${daysLeft(e)} days`} unless you restore it.`)) : ""}
    <article class="entry">
      <p class="meta"><span>${nums(when(e.logged_at))}</span>${e.history.length ? `<span class="tag">Edited</span>` : ""}</p>
      <h1>${esc(e.title || "Untitled")}</h1>${moodRow(e.moods)}
      ${e.body ? `<p class="body-text">${esc(e.body)}</p>` : ""}
      ${mine.length ? `<ul class="photos" id="photolist"></ul><ul class="voices" id="voicelist"></ul>` : ""}
    </article>
    ${e.deleted_at ? `<div class="actions"><button class="btn primary" id="restore">Restore entry</button></div>`
      : `<div class="actions entry-end"><button class="btn quiet" id="totrash">${ICON.trash}Move to trash</button></div>`}
    ${e.history.length ? `<section class="history" aria-labelledby="histh"><h2 id="histh">Edit history</h2>
      <ul class="hist">${[...e.history].reverse().map((h) => `<li><h3>Edited ${nums(short(h.edited_at))}</h3>
        <div class="diff"><div><p class="hint">Before</p>${snapHtml(h.before, h.after)}</div><div><p class="hint">After</p>${snapHtml(h.after, h.before)}</div></div></li>`).join("")}</ul></section>` : ""}`;
  if (mine.length) showMedia(mine.map((m) => ({ m })));
  if (e.deleted_at) $("#restore").onclick = () => { e.deleted_at = null; persist(); flash = note("Restored. It's back in your journal.", true); view(id); };
  else $("#totrash").onclick = () => {
    e.deleted_at = new Date().toISOString(); persist();
    flash = note(`Moved to the trash. You can restore it from the <a href="#trash">trash</a> for <span class="n">${TRASH_DAYS}</span> days.`, true);
    location.hash = `#journal/${d}`;
  };
}

// ---------- entry editor (new entries and edits follow the same rules) ----------
let stopRecording = null, finishRecording = null;
function editor(id) {
  const current = id === "new" ? null : db.entries.find((e) => e.id === id);
  if (current === undefined) { main.innerHTML = `<h1>This entry isn't here</h1><a class="btn secondary" href="#journal" style="align-self:flex-start">Back to journal</a>`; return; }
  if (current?.deleted_at) return view(id); // restore it before editing
  // iOS can close a Home Screen app while it's in the background, so what you write is also kept on this device as you
  // type and the moment the app is hidden. It comes back here until you save it or discard it.
  const kept = drafts()[id];
  const loggedAt = current?.logged_at ?? kept?.logged_at ?? new Date().toISOString(); // set by the device, never editable
  const saved = current ? db.media.filter((m) => m.entry_id === current.id) : [];
  const draft = kept ? { title: kept.title, body: kept.body, moods: [...kept.moods] }
    : { title: current?.title ?? "", body: current?.body ?? "", moods: [...(current?.moods ?? [])] };
  const pending = [], removed = new Set(); // photo and voice note changes wait here until you save
  let dirty = !!kept, saving = false, keepDraft = true, draftTimer = 0;
  leaveGuard = () => dirty;
  const unchanged = () => current ? draft.title === (current.title ?? "") && draft.body === current.body && JSON.stringify(draft.moods) === JSON.stringify(current.moods)
    : !draft.title && !draft.body && !draft.moods.length;
  const writeDraft = () => { clearTimeout(draftTimer); if (!keepDraft || !dirty) return;
    setDraft(id, unchanged() && !pending.length ? null : { title: draft.title, body: draft.body, moods: draft.moods, logged_at: loggedAt, pending: pending.length, saved_at: new Date().toISOString() }); };
  const dropDraft = () => { keepDraft = false; clearTimeout(draftTimer); setDraft(id, null); };
  letGo = dropDraft;
  const touch = () => { dirty = true; clearTimeout(draftTimer); draftTimer = setTimeout(writeDraft, 500); };
  // Going to the background also stops a recording and keeps it, instead of losing it.
  const hidden = () => { if (document.visibilityState === "hidden") { writeDraft(); finishRecording?.().then(writeDraft); } };
  addEventListener("pagehide", writeDraft); document.addEventListener("visibilitychange", hidden);
  leaving.push(() => { writeDraft(); removeEventListener("pagehide", writeDraft); document.removeEventListener("visibilitychange", hidden); });
  // Mood choices: the built-in list, then custom moods (yours from other entries and any added here), A to Z.
  const customs = [];
  const addOption = (l) => { if (!findMood(l) && !customs.some((c) => c.toLowerCase() === l.toLowerCase())) { customs.push(l); customs.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" })); } };
  [...live().flatMap((e) => e.moods), ...draft.moods].forEach(addOption);
  const options = () => [...MOODS.map((m) => m.label), ...customs];
  const has = (l) => draft.moods.some((x) => x.toLowerCase() === l.toLowerCase());
  const back = current ? `#entry/${current.id}` : "#journal";

  main.innerHTML = `<div class="editor">
    <header class="edit-top"><div class="edit-bar"><a class="textbtn" href="${back}">Cancel</a><h1>${current ? "Edit entry" : "New entry"}</h1>
      <button class="btn" id="savetop" type="button">Save</button></div><div id="err" aria-live="polite"></div></header>
    ${kept ? `<div id="draftnote">${note(`Your unsaved changes from ${nums(when(kept.saved_at))} are back.${kept.pending ? " Photos and voice notes you'd added weren't kept, so add them again." : ""}
      <br><button class="btn secondary small" type="button" data-discard-draft>Discard them</button>`, true)}</div>` : ""}
    <div class="edit-when"><span class="daylight" id="daylight" aria-hidden="true">${Number(toDay(new Date(loggedAt)).slice(8))}</span>
      <div><p class="when">${nums(when(loggedAt))}${current?.history.length ? `<span class="tag">Edited</span>` : ""}</p><p class="hint">Date and time are set automatically and can't be changed.</p></div></div>
    <div class="field"><label for="title">Title (optional)</label><input id="title" class="title-in" maxlength="200" placeholder="Untitled" autocomplete="off" value="${esc(draft.title)}"></div>
    <div class="field"><label for="body">Description (required)</label><textarea id="body" class="body-in" placeholder="What's on your mind today?">${esc(draft.body)}</textarea></div>
    <fieldset class="moodfield"><legend>How are you feeling? (required) <span class="hint">Choose all that apply.</span></legend>
      <ul class="moods" id="moodlist"></ul>
      <div class="addmood"><label for="custom">Or type your own mood</label>
        <div class="inline"><input type="text" id="custom" maxlength="40" autocomplete="off"><button class="btn secondary" id="addcustom">Add mood</button></div></div>
    </fieldset>
    <section class="media" aria-labelledby="medh">
      <h2 id="medh">Photos and voice notes</h2>
      <p class="hint">Optional. Changes here are kept when you save the entry.</p>
      <div id="medmsg" aria-live="polite"></div>
      <div class="addrows">
        <label class="actionrow">${ICON.photo}<span>Add photos<span class="hint">JPG, PNG, or WebP, up to <span class="n">25</span> MB each.</span></span>
          <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple></label>
        <div id="recorder"></div>
        <label class="actionrow">${ICON.audio}<span>Upload an audio file<span class="hint">Up to <span class="n">5</span> minutes and <span class="n">20</span> MB.</span></span>
          <input type="file" id="audiofile" accept=".m4a,.mp3,.wav,.ogg,.webm,.aac,audio/mp4,audio/x-m4a,audio/mpeg,audio/wav,audio/ogg,audio/webm,audio/aac"></label>
      </div>
      <ul class="photos" id="photolist"></ul>
      <ul class="voices" id="voicelist"></ul>
    </section>
    <div class="dock"><button class="btn primary wide" id="save">${current ? "Save changes" : "Save entry"}</button></div>
  </div>`;

  // iOS keeps the page still when the keyboard opens and pans a smaller visible area over it. Following that area keeps
  // the top bar, with Cancel, Save and any error, in view while you type (see .edit-top).
  const vv = window.visualViewport;
  if (vv) {
    const pin = () => main.style.setProperty("--vv-top", `${Math.max(0, Math.round(vv.offsetTop))}px`);
    vv.addEventListener("resize", pin); vv.addEventListener("scroll", pin); pin();
    leaving.push(() => { vv.removeEventListener("resize", pin); vv.removeEventListener("scroll", pin); main.style.removeProperty("--vv-top"); });
  }

  // What still stops a save. After a failed save the message under the top bar updates as you fix things, then goes away.
  const problems = () => [!draft.body.trim() && "Write a description.", !options().some(has) && "Choose at least one mood, or type your own."].filter(Boolean).join(" ");
  let shown = "";
  const showProblems = () => {
    const p = problems();
    if (p !== shown) $("#err").innerHTML = p ? note(`${current ? "Your changes can't be saved yet." : "This entry can't be saved yet."} ${p}`) : "";
    shown = p;
  };
  // This entry's light kindles in the blend of the moods you choose, the way its day will in the calendar.
  const kindle = () => { const ms = options().filter(has), c = ms.length ? blend(ms) : null, el = $("#daylight");
    el.classList.toggle("lit", !!c); el.style.cssText = c ? `--day:${css(c)};--on:${inkOn(c)}` : ""; };

  const body = $("#body");
  const grow = () => { body.style.height = "auto"; body.style.height = body.scrollHeight + "px"; };
  grow();
  $("#title").oninput = (e) => { draft.title = e.target.value; touch(); };
  body.oninput = (e) => { draft.body = e.target.value; touch(); grow(); if (shown) showProblems(); };

  function renderMoods() {
    $("#moodlist").innerHTML = options().map((l) => { const m = moodInfo(l);
      return `<li><label class="chip" style="${moodVars(m.rgb)}"><input type="checkbox" value="${esc(m.label)}"${has(l) ? " checked" : ""}><i class="dot" aria-hidden="true"></i>${esc(m.label)}</label></li>`; }).join("");
    $$("#moodlist input").forEach((c) => c.onchange = () => {
      draft.moods = c.checked ? [...draft.moods, c.value] : draft.moods.filter((x) => x.toLowerCase() !== c.value.toLowerCase()); touch();
      kindle(); if (shown) showProblems();
    });
    kindle();
  }
  const addCustom = () => {
    const l = cleanMood($("#custom").value); $("#custom").value = ""; if (!l) return;
    addOption(l); if (!has(l)) draft.moods.push(l); touch(); renderMoods(); if (shown) showProblems();
  };
  renderMoods();
  $("#addcustom").onclick = addCustom;
  $("#custom").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(); } };

  $("#savetop").onclick = () => $("#save").click(); // the same save, in reach while the keyboard is up
  $("[data-discard-draft]")?.addEventListener("click", () => { dropDraft(); dirty = false; route(); });
  $("#save").onclick = async () => {
    if (saving) return;
    saving = true; await finishRecording?.(); saving = false; // a recording still going is stopped and added first
    if ($("#custom").value.trim()) addCustom(); // a typed mood counts even if you didn't press Add
    const text = draft.body.trim(), moods = options().filter(has);
    shown = ""; showProblems();
    if (shown) { // the message sits under the top bar; then focus goes to the first thing that's missing
      $("#err").scrollIntoView({ block: "nearest" });
      const fix = text ? $("#moodlist input") : body; fix.focus({ preventScroll: true }); fix.scrollIntoView({ block: "center" }); return;
    }
    const keep = [...saved.filter((m) => !removed.has(m.id)), ...pending.map((p) => p.m)];
    const before = current && snap(current.title ?? null, current.body, current.moods, saved), after = snap(draft.title.trim() || null, text, moods, keep);
    if (current && JSON.stringify(before) === JSON.stringify(after)) { dirty = false; dropDraft(); flash = note("Nothing changed, so there was nothing new to save.", true); location.hash = back; return; }
    saving = true; $("#save").disabled = true;
    try { for (const p of pending) await putFile(p.m.id, p.blob); }
    catch { saving = false; $("#save").disabled = false; $("#err").innerHTML = note("Your photos or voice notes couldn't be saved. Your browser may be out of space. Try removing one and saving again."); $("#err").scrollIntoView({ block: "nearest" }); return; }
    removed.forEach((mid) => delFile(mid).catch(() => {}));
    const now = new Date().toISOString();
    let entry = current;
    if (!entry) { entry = { id: uid(), logged_at: loggedAt, created_at: now, history: [], deleted_at: null }; db.entries.push(entry); }
    else entry.history.push({ edited_at: now, before, after }); // every edit keeps a full before-and-after copy
    Object.assign(entry, { title: after.title, body: text, moods, updated_at: now });
    pending.forEach((p) => p.m.entry_id = entry.id);
    db.media = [...db.media.filter((m) => !removed.has(m.id)), ...pending.map((p) => p.m)];
    persist(); dirty = false; dropDraft();
    flash = note(current ? "Changes saved." : "Entry saved.", true);
    location.hash = current ? `#entry/${entry.id}` : `#journal/${dayOf(entry)}`;
  };

  const msg = (text, ok) => { $("#medmsg").innerHTML = text ? `<p class="notice ${ok ? "ok" : ""}">${nums(text)}</p>` : ""; };
  const renderMedia = () => showMedia([...saved.filter((m) => !removed.has(m.id)).map((m) => ({ m })), ...pending], (mid) => {
    const i = pending.findIndex((p) => p.m.id === mid); if (i >= 0) pending.splice(i, 1); else removed.add(mid); touch(); renderMedia();
  });
  const stage = (kind, blob, seconds) => {
    pending.push({ blob, m: { id: uid(), entry_id: null, kind, mime_type: blob.type.split(";")[0], size_bytes: blob.size,
      duration_seconds: seconds == null ? null : Math.ceil(seconds), created_at: new Date().toISOString() } });
    touch(); renderMedia();
  };
  renderMedia();

  $("#photos").onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = ""; msg("");
    for (const f of files) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(f.type)) { msg(`${f.name} isn't a JPG, PNG, or WebP photo.`); continue; }
      if (f.size > 25 * 1024 * 1024) { msg(`That photo is ${(f.size / 1048576).toFixed(1)} MB. Photos can be up to 25 MB.`); continue; }
      stage("photo", await shrink(f), null);
    }
  };
  $("#audiofile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; msg("");
    if (f.size > 20 * 1024 * 1024) { msg(`That recording is ${(f.size / 1048576).toFixed(1)} MB. Voice notes can be up to 20 MB.`); e.target.value = ""; return; }
    const seconds = await new Promise((res) => { const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = () => res(isFinite(a.duration) ? a.duration : null); a.onerror = () => res(null); a.src = objectUrl(f); });
    if (seconds != null && seconds > 300) msg("That recording is longer than 5 minutes. Voice notes can be up to 5 minutes.");
    else { stage("voice", f, seconds); msg("Voice note added. It's kept when you save the entry.", true); }
    e.target.value = "";
  };
  recorder($("#recorder"), (blob, s) => { stage("voice", blob, s); msg("Voice note added. It's kept when you save the entry.", true); }, msg);
}

// ---------- trash page ----------
function trash() {
  const gone = purged; purged = 0;
  const list = db.entries.filter((e) => e.deleted_at).sort((a, b) => b.deleted_at.localeCompare(a.deleted_at));
  main.innerHTML = `${backBar("#journal", "Journal")}
    <header class="titleblock"><h1>Trash</h1><p class="lede">${nums(`Deleted entries stay here for ${TRASH_DAYS} days. Restoring one brings it back with its original date and edit history. After ${TRASH_DAYS} days it's permanently deleted.`)}</p></header>
    ${takeFlash()}
    ${gone ? note(nums(`${gone === 1 ? "1 entry was" : `${gone} entries were`} in the trash for more than ${TRASH_DAYS} days and ${gone === 1 ? "has" : "have"} been permanently deleted.`)) : ""}
    ${list.length ? `<ul class="trashlist">${list.map((e) => { const n = daysLeft(e); return `<li data-id="${e.id}">${light(e.moods)}
      <p class="entry-title">${esc(e.title || "Untitled")}</p>
      <p class="hint"><span class="left">${n <= 1 ? "Permanently deleted within a day." : nums(`${n} days left.`)}</span> Moved here ${nums(short(e.deleted_at))}.</p>
      <p class="hint">Written ${nums(when(e.logged_at))}</p>
      ${moodRow(e.moods)}${e.body ? `<p class="excerpt">${esc(e.body.slice(0, 160))}</p>` : ""}
      <div class="actions"><button class="btn secondary small" data-act="restore">Restore</button><a class="btn quiet" href="#entry/${e.id}">View</a><button class="btn quiet danger" data-act="forever">Delete forever</button></div></li>`; }).join("")}</ul>
    <details class="tools"><summary>Testing tools</summary>
      <div class="stack"><p class="hint">Pretend an entry was deleted some days ago. Anything in the trash for more than <span class="n">${TRASH_DAYS}</span> days is permanently deleted right away.</p>
        <label class="f">Entry<select id="agepick">${list.map((e) => `<option value="${e.id}">${esc(e.title || "Untitled")}, written ${esc(short(e.logged_at))}</option>`).join("")}</select></label>
        <label class="f">Deleted how many days ago?<input type="number" id="agedays" min="0" max="365" value="31" inputmode="numeric"></label>
        <button class="btn secondary" id="age">Change deleted date</button></div></details>`
    : `<div><p class="emptytitle">The trash is empty</p><p class="soft" style="margin-top:8px">Entries you move to the trash show up here.</p></div>`}`;
  $$("[data-act]").forEach((b) => b.onclick = () => {
    const e = db.entries.find((x) => x.id === b.closest("li").dataset.id);
    if (b.dataset.act === "restore") { e.deleted_at = null; persist(); flash = note(`Restored. It's back on <a href="#journal/${dayOf(e)}">${nums(longDay(dayOf(e)))}</a>.`, true); return trash(); }
    if (confirm("Permanently delete this entry, its photos and voice notes, and its edit history? This can't be undone.")) { removeEntries([e]); trash(); }
  });
  $("#age") && ($("#age").onclick = () => {
    const e = db.entries.find((x) => x.id === $("#agepick").value), days = Number($("#agedays").value);
    if (!e || !(days >= 0)) return;
    e.deleted_at = new Date(Date.now() - days * 864e5).toISOString(); persist();
    purged += purgeTrash(); trash();
  });
}

// ---------- voice recorder (MediaRecorder) ----------
// A recording is added to the entry as soon as it stops, so it can't be left behind when the entry is saved.
// AAC (.m4a) first: it plays in Files, Messages and on Windows and Android, so voice notes in a backup open anywhere.
const TYPES = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
function recorder(el, onSave, msg) {
  let stream, rec, started, tick, done;
  const idle = () => { el.innerHTML = `<button class="actionrow" type="button">${ICON.mic}<span>Record a voice note${ios ? `<span class="hint">Your iPhone asks for the microphone each time Glimmer opens.</span>` : ""}</span></button><span class="sr" aria-live="polite" id="recsr"></span>`; el.firstChild.onclick = start; };
  stopRecording = () => { clearInterval(tick); stream?.getTracks().forEach((t) => t.stop()); if (rec?.state === "recording") { rec.onstop = null; rec.stop(); } };
  finishRecording = () => rec?.state === "recording" ? new Promise((res) => { done = res; rec.stop(); }) : Promise.resolve();
  async function start() {
    msg("");
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { msg("This browser can't record audio here. You can upload an audio file instead. (Recording needs https:// or a local file.)"); return; }
    el.innerHTML = `<button class="actionrow" type="button" disabled>${ICON.mic}<span>Waiting for microphone…</span></button>`;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) {
      idle();
      msg(err.name === "NotAllowedError" ? (ios ? "Glimmer can't use your microphone right now. Choose Allow when your iPhone asks. If it doesn't ask, swipe Glimmer away in the app switcher and open it again, or upload an audio file instead."
          : "Glimmer can't use your microphone right now. You can allow it in your browser settings, or upload an audio file instead.")
        : err.name === "NotFoundError" ? "No microphone was found. You can upload an audio file instead."
        : "The microphone couldn't start. It may be in use by another app. You can upload an audio file instead.");
      return;
    }
    const type = TYPES.find((t) => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      clearInterval(tick); stream.getTracks().forEach((t) => t.stop());
      const seconds = Math.min(300, (Date.now() - started) / 1000);
      onSave(new Blob(chunks, { type: (rec.mimeType || type || "audio/webm").split(";")[0] }), seconds);
      if (seconds >= 300) msg("Recordings stop at 5 minutes. This one was added, and you can record another.", true);
      idle(); done?.(); done = null;
    };
    started = Date.now(); rec.start(1000);
    el.innerHTML = `<div class="rec"><span class="sr" aria-live="polite">Recording started</span><span class="rec-live"><span class="rec-dot" aria-hidden="true"></span><b>Recording</b> <span id="clock">0:00</span> <span class="hint">of <span class="n">5:00</span></span></span><button class="btn secondary small" id="rstop">Stop</button></div>`;
    $("#rstop", el).onclick = () => rec.stop();
    tick = setInterval(() => {
      const s = (Date.now() - started) / 1000; $("#clock", el).textContent = fmtDur(s);
      if (s >= 300) { clearInterval(tick); rec.stop(); }
    }, 250);
  }
  idle();
}

// ---------- mood ----------
function mood() {
  leaveGuard = null;
  const since = Date.now() - 30 * 864e5;
  const recent = db.moods.filter((m) => new Date(m.checked_in_at).getTime() >= since);
  const counts = MOODS.map((m) => ({ m, n: recent.filter((c) => c.mood_key === m.key).length }));
  const max = Math.max(1, ...counts.map((c) => c.n));
  const byDay = {};
  [...db.moods].sort((a, b) => b.checked_in_at.localeCompare(a.checked_in_at))
    .forEach((c) => { const day = (byDay[toDay(new Date(c.checked_in_at))] ??= []), last = day.at(-1);
      if (last?.at === c.checked_in_at) last.ms.push(c.mood_key); else day.push({ at: c.checked_in_at, ms: [c.mood_key] }); });
  main.innerHTML = `<header class="pagehead"><h1>Mood</h1></header>${!db.moods.length ? `<div><p class="emptytitle">No check-ins yet</p><p class="soft" style="margin-top:8px">You can check in from the <a href="#home">home page</a> whenever you like.</p></div>` : `
    <figure class="chart"><figcaption><h2>Your check-ins, last 30 days</h2></figcaption>
      <ul class="bars">${counts.map(({ m, n }) => `<li><span class="bar-label"><span class="swatch" style="background:${css(m.rgb)}" aria-hidden="true"></span>${m.label}<span class="sr">, ${n} check-ins</span></span>
        <span class="track" aria-hidden="true">${n ? `<span class="bar" style="--p:${css(m.rgb)};--n:${max <= 24 ? n : 1};--f:${n / max}"></span>` : ""}<span class="num">${n}</span></span></li>`).join("")}</ul>
      <details><summary>Show as a table</summary><table><tr><th>Mood</th><th>Check-ins</th></tr>${counts.map(({ m, n }) => `<tr><td>${m.label}</td><td>${n}</td></tr>`).join("")}</table></details>
    </figure>
    <section class="byday"><h2>By day</h2>${Object.entries(byDay).map(([day, list]) => `<div><h3>${nums(longDay(day))}</h3>
      <ul>${list.map((c) => `<li><span class="t">${nums(time(c.at))}</span><span class="moodrow">${c.ms.map((k) => moodTag(MOODS.find((x) => x.key === k).label)).join("")}</span></li>`).join("")}</ul></div>`).join("")}
    </section>`}`;
}

// ---------- goals & worries ----------
function followPicker(name) {
  return `<fieldset><legend>When should Glimmer check in?</legend><div class="seg">
    ${[["tomorrow", "Tomorrow"], ["week", "In a week"], ["month", "In a month"], ["date", "Pick a date"]].map(([v, l]) =>
      `<label><input type="radio" name="${name}" value="${v}" ${v === "week" ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
    <input type="date" data-pick="${name}" min="${today()}" hidden aria-label="Date"></fieldset>`;
}
function pickedDate(root, name) {
  const v = $(`input[name="${name}"]:checked`, root).value;
  return v === "tomorrow" ? addDays(today(), 1) : v === "week" ? addDays(today(), 7) : v === "month" ? addMonth(today()) : $(`[data-pick="${name}"]`, root).value || null;
}
function wirePicker(root, name) {
  $$(`input[name="${name}"]`, root).forEach((r) => r.onchange = () => $(`[data-pick="${name}"]`, root).hidden = r.value !== "date" || !r.checked);
}
function goals() {
  leaveGuard = null;
  const open = db.items.filter((i) => i.status !== "resolved").sort((a, b) => (a.follow_up_on ?? "").localeCompare(b.follow_up_on ?? ""));
  const resolved = db.items.filter((i) => i.status === "resolved");
  // Resolve leads, Postpone and Edit stay plain, and Delete is a glyph at the far end so it's never next to Resolve.
  const row = (i) => `<li data-id="${i.id}"><p class="item-text">${esc(i.text)}</p>
    ${i.status !== "resolved" ? `<p class="hint">${i.status === "postponed" ? "Postponed to" : "Next check-in:"} ${nums(longDay(i.follow_up_on))}</p>` : ""}
    <div class="actions">${i.status !== "resolved" ? `<button class="btn secondary small" data-act="resolve">${ICON.check}Resolve</button><button class="btn quiet" data-act="postpone">Postpone</button><button class="btn quiet" data-act="edit">Edit</button>` : ""}
    <button class="iconbtn danger end" data-act="delete" aria-label="Delete">${ICON.trash}</button></div></li>`;
  const section = (title, list) => list.length ? `<section><h2>${title}</h2><ul class="items">${list.map(row).join("")}</ul></section>` : "";
  main.innerHTML = `<header class="titleblock"><h1>Goals &amp; worries</h1><p class="lede">Glimmer checks in on the day you choose, right on your home page.</p></header>
    <form class="addform" id="add"><h2>Add something</h2>
      <fieldset><legend>Is it a goal or a worry?</legend><div class="seg"><label><input type="radio" name="kind" value="goal" checked><span>Goal</span></label><label><input type="radio" name="kind" value="worry"><span>Worry</span></label></div></fieldset>
      <label class="f">What is it?<textarea class="in" name="text" rows="2" maxlength="500" required></textarea></label>
      ${followPicker("add-fu")}<div id="addmsg"></div><button class="btn primary">Add to my list</button></form>
    ${db.items.length ? "" : `<div><p class="emptytitle">Nothing on your list yet</p><p class="soft" style="margin-top:8px">Add a goal you're working toward or a worry you'd like to check in on later.</p></div>`}
    ${section("Goals", open.filter((i) => i.kind === "goal"))}${section("Worries", open.filter((i) => i.kind === "worry"))}
    ${resolved.length ? `<details class="resolved"><summary><span>Resolved (<span class="n">${resolved.length}</span>)</span></summary><ul class="items">${resolved.map(row).join("")}</ul></details>` : ""}`;
  const form = $("#add"); wirePicker(form, "add-fu");
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = form.text.value.trim(), date = pickedDate(form, "add-fu");
    if (!text) return;
    if (!date) { $("#addmsg").innerHTML = `<p class="notice">Choose a date for the check-in.</p>`; return; }
    db.items.push({ id: uid(), kind: form.kind.value, text, status: "active", follow_up_on: date, created_at: new Date().toISOString() });
    persist(); goals();
  };
  $$("[data-act]").forEach((b) => b.onclick = () => {
    const li = b.closest("li"), item = db.items.find((i) => i.id === li.dataset.id), act = b.dataset.act;
    if (act === "resolve") { item.status = "resolved"; persist(); return goals(); }
    if (act === "delete") { if (confirm("Delete this item? This can't be undone.")) { db.items = db.items.filter((i) => i !== item); db.responses = db.responses.filter((r) => r.item_id !== item.id); persist(); goals(); } return; }
    const name = "fu-" + item.id;
    li.innerHTML = `${act === "edit" ? `<label class="f">What is it?<textarea class="in" rows="2" maxlength="500">${esc(item.text)}</textarea></label>` : `<p class="item-text">${esc(item.text)}</p>`}
      ${followPicker(name)}<div class="actions"><button class="btn secondary small" data-save>${act === "edit" ? "Save changes" : "Postpone"}</button><button class="btn quiet" data-cancel>Cancel</button></div>`;
    wirePicker(li, name);
    $("[data-cancel]", li).onclick = goals;
    $("[data-save]", li).onclick = () => {
      const date = pickedDate(li, name); if (!date) return;
      if (act === "edit") { const t = $("textarea", li).value.trim(); if (!t) return; item.text = t; } else item.status = "postponed";
      item.follow_up_on = date; persist(); goals();
    };
  });
}

// ---------- settings ----------
const busy = (text) => `<p class="hint" role="status">${text}</p>`; // work in progress; the text always ends with "…"
const lastBackup = () => isIso(ui.lastBackup) ? nums(`Last backup: ${when(ui.lastBackup)}.`) : "No backup yet.";
// Storage in plain words: how much Glimmer uses, and whether the browser has promised to keep it.
const fmtSize = (b) => b < 1e6 ? "less than 1 MB" : b < 1e9 ? `${(b / 1e6).toFixed(b < 1e7 ? 1 : 0)} MB` : `${(b / 1e9).toFixed(1)} GB`;
async function storageText() {
  const s = navigator.storage;
  const [est, kept] = await Promise.all([s?.estimate?.().catch(() => null), s?.persisted?.().catch(() => false)]);
  const used = Number.isFinite(est?.usage) ? `Glimmer is using ${fmtSize(est.usage)} on this device. ` : "";
  return nums(used + (kept ? "Your journal is protected from automatic clearing."
    : `The browser may clear your journal if the phone runs low on space${installed ? ", so keep a recent backup."
      : `; installing Glimmer ${ios ? "to your Home Screen" : "as an app"} protects it.`}`));
}

      <p class="hint" id="lastbackup">${lastBackup()}</p><button class="btn secondary" id="dl">Save a backup</button><div id="dlmsg" aria-live="polite"></div></section>`;
  const restore = `<section class="settings-block" aria-labelledby="rsh"><h2 id="rsh">Restore from a backup</h2>
      <p>Adds anything in the backup that isn't here yet. Nothing you have now is removed or changed.</p>
      <label class="btn secondary filebtn">Choose a backup file<input type="file" id="restorefile" accept=".zip,.json,application/zip,application/json"></label>
      <div id="restoremsg" aria-live="polite"></div></section>`;
  // With nothing to back up yet (a new install, or after Delete everything), restoring comes first.
  main.innerHTML = `${backBar("#home", "Home")}<h1>Settings</h1>
    <section class="settings-block keep"><h2>Your journal stays on this device</h2><p>Glimmer saves your entries, photos, voice notes, check-ins, goals and worries in ${here} on this device. Nothing is sent to a server, and there's no account.</p>
      <p class="hint" id="storage"></p></section>
    ${canInstall ? `<section class="settings-block" aria-labelledby="ish"><h2 id="ish">Add Glimmer to your Home Screen</h2>${installSteps("below")}</section>` : ""}
    ${journalEmpty() ? restore + backup : backup + restore}
    <section class="settings-block" aria-labelledby="uph"><h2 id="uph">Updates</h2><p>Glimmer updates itself when you're online. If something seems out of date, you can check now.</p>
      <button class="btn secondary" id="update">Check for updates</button><div id="updatemsg" aria-live="polite">${updated ? note("You have the newest version of Glimmer.", true) : ""}</div></section>
    <section class="settings-block"><h2>Delete everything</h2>
      <p>This removes all of your entries, photos, voice notes, mood check-ins, goals and worries from ${here}. It can't be undone, so save a backup first if you might want them back.</p>
      <label class="f">Type "delete my data" to confirm<input type="text" id="confirm" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <button class="btn secondary danger" id="wipe" disabled>Delete my data</button></section>`;
  // Kept as elements, so work that finishes after you've left Settings lands nowhere instead of failing.
  const [storage, last, dl, dlmsg, file, restoremsg, update, updatemsg] = ["#storage", "#lastbackup", "#dl", "#dlmsg", "#restorefile", "#restoremsg", "#update", "#updatemsg"].map((s) => $(s));
  const showStorage = () => storageText().then((t) => storage.innerHTML = t);
  showStorage();
  // Messages appear under their button, which can be low on the screen, so bring each one above the tab bar.
  const say = (el, html) => { el.innerHTML = html; if (html && el.isConnected) el.scrollIntoView({ block: "nearest" }); };

  const offer = async (f) => {
    const how = await offerFile(f);
    if (how === "retry") { // iPhone only opens the share sheet right after a tap, and making the file took longer than that
      say(dlmsg, `<div class="notice ok" role="status"><p>Your backup is ready.</p><button class="btn primary small" id="dlagain">Save the backup file</button></div>`);
      $("#dlagain", dlmsg).onclick = () => offer(f);
    } else if (how === "cancelled") say(dlmsg, "");
    else {
      setUi({ lastBackup: new Date().toISOString() }); last.innerHTML = lastBackup();
      say(dlmsg, note(`${how === "shared" ? "Backup saved" : "Backup downloaded"}: <span class="file">${nums(f.name)}</span>.`, true));
    }
  };
  dl.onclick = async () => {
    dl.disabled = true; say(dlmsg, busy("Preparing your backup…"));
    try { await offer(await makeBackup()); }
    catch { say(dlmsg, note(`The backup couldn't be made. Try again, and if it keeps failing, ${installed ? "close Glimmer and open it again" : "reload the page"}.`)); }
    dl.disabled = false;
  };
  file.onchange = async () => {
    const f = file.files[0]; file.value = ""; if (!f) return;
    say(restoremsg, busy("Restoring…"));
    try { say(restoremsg, note(nums(await restoreBackup(f)), true)); showStorage(); }
    catch (err) { say(restoremsg, note(esc(err.message))); }
  };
  // Checks for a new version of the app's files, then reloads. The page itself always comes fresh when you're online.
  update.onclick = async () => {
    if (!navigator.onLine) { say(updatemsg, note("You're offline, so Glimmer can't check right now. It checks on its own once you're back online.")); return; }
    update.disabled = true; say(updatemsg, busy("Checking for updates…"));
    try {
      const reg = await sw; await reg?.update();
      const next = reg?.installing; // a new version saves its files, then takes over by itself
      if (next) await new Promise((done) => { const over = () => /activated|redundant/.test(next.state) && done(); next.onstatechange = over; over(); setTimeout(done, 10000); });
    } catch { update.disabled = false; say(updatemsg, note("Glimmer couldn't reach the internet to check. Try again in a moment.")); return; }
    say(updatemsg, busy("Opening the newest version…"));
    try { sessionStorage.setItem("glimmer-updated", "1"); } catch {}
    location.reload();
  };
  $("#confirm").oninput = (e) => $("#wipe").disabled = e.target.value.trim().toLowerCase() !== "delete my data";
  $("#wipe").onclick = async () => {
    await fileOp("readwrite", (s) => s.clear()).catch(() => {}); // every photo and voice note, even ones a failed save left behind
    localStorage.removeItem(KEY); localStorage.removeItem(DRAFT_KEY); // never localStorage.clear(): other projects share this address
    Object.assign(db, { entries: [], media: [], moods: [], items: [], responses: [] });
    main.innerHTML = `<p class="notice ok">Everything has been deleted from ${here}. Backup files you saved aren't affected.</p><a class="btn secondary" href="#home" style="align-self:flex-start">Go home</a>`;
  };
}

// ---------- backup files: a plain .zip (stored, not compressed) that holds data.json and the media ----------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
// files: [{ name, blob }]. Blob parts reference the originals, so big photo libraries aren't copied into one huge string.
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const { name, blob } of files) {
    const n = enc.encode(name), size = blob.size, crc = crc32(new Uint8Array(await blob.arrayBuffer()));
    const h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [10, dosTime, 2], [12, dosDate, 2], [14, crc, 4], [18, size, 4], [22, size, 4], [26, n.length, 2]].forEach(([o, v, w]) => w === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [12, dosTime, 2], [14, dosDate, 2], [16, crc, 4], [20, size, 4], [24, size, 4], [28, n.length, 2], [42, offset, 4]].forEach(([o, v, w]) => w === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(h.buffer, n, blob); central.push(c.buffer, n);
    offset += 30 + n.length + size;
  }
  const cdSize = central.reduce((t, p) => t + p.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, offset, 4]].forEach(([o, v, w]) => w === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}
// Returns a Map of file name -> Blob. Reads stored entries, and compressed ones where the browser can inflate them.
async function readZip(file) {
  const tailStart = Math.max(0, file.size - 65557), tail = new DataView(await file.slice(tailStart).arrayBuffer());
  let e = -1;
  for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("not a zip");
  const count = tail.getUint16(e + 10, true), cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()), dec = new TextDecoder(), out = new Map();
  for (let i = 0, p = 0; i < count; i++) {
    if (p + 46 > cd.byteLength || cd.getUint32(p, true) !== 0x02014b50) throw new Error("damaged zip");
    const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true), nlen = cd.getUint16(p + 28, true), skip = cd.getUint16(p + 30, true) + cd.getUint16(p + 32, true), off = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen));
    p += 46 + nlen + skip;
    if (name.endsWith("/")) continue;
    const lh = new DataView(await file.slice(off, off + 30).arrayBuffer()), start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let blob = file.slice(start, start + csize);
    if (method === 8) {
      if (!window.DecompressionStream) throw new Error("compressed zip");
      blob = await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    } else if (method !== 0) throw new Error("compressed zip");
    out.set(name, blob);
  }
  return out;
}

// ---------- backup and restore ----------
// A backup is one .zip file: data.json (the same shape as the old "Download my data" export) plus media/<id>.<ext>
// for every photo and voice note. Restoring adds what isn't already here and never removes or changes anything.
const EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "audio/mp4": "m4a", "audio/x-m4a": "m4a", "audio/aac": "aac",
  "audio/mpeg": "mp3", "audio/wav": "wav", "audio/x-wav": "wav", "audio/ogg": "ogg", "audio/webm": "webm" };
const exportData = () => ({ app: "Glimmer", backup_version: 1, exported_at: new Date().toISOString(),
  entries: db.entries.map((e) => ({ ...e, media: db.media.filter((m) => m.entry_id === e.id) })),
  mood_checkins: db.moods, goals_worries: db.items.map((i) => ({ ...i, follow_up_responses: db.responses.filter((r) => r.item_id === i.id) })) });

async function makeBackup() {
  const files = [{ name: "data.json", blob: new Blob([JSON.stringify(exportData(), null, 2)], { type: "application/json" }) }];
  for (const m of db.media) {
    const blob = await getFile(m.id).catch(() => null);
    if (blob) files.push({ name: `media/${m.id}.${EXT[m.mime_type] ?? "bin"}`, blob });
  }
  return new File([await makeZip(files)], `glimmer-backup-${today()}.zip`, { type: "application/zip" });
}

// Phones get the share sheet (Save to Files, AirDrop); everything else downloads the file.
// Returns "shared", "downloaded", "cancelled", or "retry" when the tap expired while the file was being prepared.
async function offerFile(file) {
  if (navigator.canShare?.({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ files: [file] }); return "shared"; }
    catch (e) { if (e.name === "AbortError") return "cancelled"; if (e.name === "NotAllowedError") return "retry"; }
  }
  const a = Object.assign(document.createElement("a"), { href: objectUrl(file), download: file.name });
  document.body.append(a); a.click(); a.remove();
  return "downloaded";
}

const BAD_FILE = "This file isn't a Glimmer backup. Choose the .zip file from Save a backup, or a .json file from an older export.";
const isIso = (s) => typeof s === "string" && !Number.isNaN(Date.parse(s));
const clip = (s, max) => (typeof s === "string" ? s.slice(0, max) : null);
const moodList = (a) => (Array.isArray(a) ? [...new Set(a.filter((x) => typeof x === "string").map(cleanMood).filter(Boolean))] : []);
const snapshot = (s) => s && typeof s === "object" ? { title: clip(s.title, 200) || null, body: clip(s.body, 100000) ?? "", moods: moodList(s.moods),
  media: Array.isArray(s.media) ? s.media.filter((m) => typeof m?.id === "string").map((m) => ({ id: m.id, kind: m.kind === "voice" ? "voice" : "photo" })) : [] } : null;

async function restoreBackup(file) {
  let data, files = new Map();
  try {
    // A zip starts with "PK", which still works when a file has lost its name or type (renamed, or from a cloud app).
    if (/\.zip$/i.test(file.name) || /zip/.test(file.type) || (await file.slice(0, 2).text()) === "PK") {
      // Accept a backup that was unzipped and zipped again (names inside one folder); skip macOS extras.
      for (const [name, blob] of await readZip(file)) if (!name.startsWith("__MACOSX/")) files.set(name.replace(/^[^/]+\/(?=data\.json$|media\/)/, ""), blob);
      if (!files.has("data.json")) throw new Error(BAD_FILE);
      data = JSON.parse(await files.get("data.json").text());
    } else data = JSON.parse(await file.text());
  } catch (e) { throw new Error(e.message === BAD_FILE ? BAD_FILE : e.message === "compressed zip" ? "This zip was compressed by another app. Unzip it and choose the data.json file inside, or use the original backup file." : "This file is damaged or isn't a Glimmer backup, so nothing was restored."); }
  if (!data || typeof data !== "object" || !["entries", "mood_checkins", "goals_worries"].some((k) => Array.isArray(data[k]))) throw new Error(BAD_FILE);

  const media = new Map(); // media id -> file in the zip
  for (const [name, blob] of files) { const m = name.match(/^media\/([^/]+)\.[a-z0-9]+$/i); if (m) media.set(m[1], blob); }
  const n = { entries: 0, media: 0, moods: 0, items: 0, skipped: 0, failed: 0 };
  const entryIds = new Set(db.entries.map((e) => e.id)), mediaIds = new Set(db.media.map((m) => m.id));
  for (const e of Array.isArray(data.entries) ? data.entries : []) {
    if (typeof e?.id !== "string" || !isIso(e.logged_at)) continue;
    if (entryIds.has(e.id)) n.skipped++;
    else {
      db.entries.push({ id: e.id, logged_at: e.logged_at, created_at: isIso(e.created_at) ? e.created_at : e.logged_at, updated_at: isIso(e.updated_at) ? e.updated_at : e.logged_at,
        title: clip(e.title, 200) || null, body: clip(e.body, 100000) ?? "", moods: moodList(e.moods),
        history: (Array.isArray(e.history) ? e.history : []).filter((h) => isIso(h?.edited_at) && snapshot(h.before) && snapshot(h.after))
          .map((h) => ({ edited_at: h.edited_at, before: snapshot(h.before), after: snapshot(h.after) })),
        deleted_at: isIso(e.deleted_at) ? e.deleted_at : null });
      entryIds.add(e.id); n.entries++;
    }
    // Photos and voice notes come back even for entries that are already here (e.g. after restoring an older text-only export).
    for (const m of Array.isArray(e.media) ? e.media : []) {
      if (typeof m?.id !== "string" || mediaIds.has(m.id) || !media.has(m.id)) continue;
      const type = typeof m.mime_type === "string" && /^(image|audio)\//.test(m.mime_type) ? m.mime_type : media.get(m.id).type;
      const blob = media.get(m.id).slice(0, media.get(m.id).size, type);
      try { await putFile(m.id, blob); } catch { n.failed++; continue; }
      db.media.push({ id: m.id, entry_id: e.id, kind: m.kind === "voice" ? "voice" : "photo", mime_type: type, size_bytes: blob.size,
        duration_seconds: Number.isFinite(m.duration_seconds) ? m.duration_seconds : null, created_at: isIso(m.created_at) ? m.created_at : new Date().toISOString() });
      mediaIds.add(m.id); n.media++;
    }
  }
  const moodIds = new Set(db.moods.map((c) => c.id)), keys = new Set(MOODS.map((m) => m.key));
  for (const c of Array.isArray(data.mood_checkins) ? data.mood_checkins : []) {
    if (typeof c?.id !== "string" || !keys.has(c.mood_key) || !isIso(c.checked_in_at)) continue;
    if (moodIds.has(c.id)) { n.skipped++; continue; }
    db.moods.push({ id: c.id, mood_key: c.mood_key, checked_in_at: c.checked_in_at }); moodIds.add(c.id); n.moods++;
  }
  const itemIds = new Set(db.items.map((i) => i.id)), responseIds = new Set(db.responses.map((r) => r.id));
  for (const i of Array.isArray(data.goals_worries) ? data.goals_worries : []) {
    if (typeof i?.id !== "string" || !["goal", "worry"].includes(i.kind) || typeof i.text !== "string" || !i.text.trim()) continue;
    if (itemIds.has(i.id)) { n.skipped++; continue; }
    db.items.push({ id: i.id, kind: i.kind, text: i.text.trim().slice(0, 500), status: ["active", "postponed", "resolved"].includes(i.status) ? i.status : "active",
      follow_up_on: isDay(i.follow_up_on) ? i.follow_up_on : addDays(today(), 7), created_at: isIso(i.created_at) ? i.created_at : new Date().toISOString() });
    itemIds.add(i.id); n.items++;
    for (const r of Array.isArray(i.follow_up_responses) ? i.follow_up_responses : []) {
      if (typeof r?.id !== "string" || responseIds.has(r.id)) continue;
      db.responses.push({ id: r.id, item_id: i.id, response: ["still_on_my_mind", "better", "done"].includes(r.response) ? r.response : "better",
        note: clip(r.note, 1000), created_at: isIso(r.created_at) ? r.created_at : new Date().toISOString() });
      responseIds.add(r.id);
    }
  }
  persist();
  const parts = [[n.entries, "entry", "entries"], [n.media, "photo or voice note", "photos and voice notes"], [n.moods, "mood check-in", "mood check-ins"], [n.items, "goal or worry", "goals and worries"]]
    .filter(([c]) => c).map(([c, one, many]) => `${c} ${c === 1 ? one : many}`);
  return (parts.length ? `Backup restored: ${and(parts)}.` : "Everything in this backup is already here, so nothing was added.")
    + (parts.length && n.skipped ? ` ${n.skipped === 1 ? "1 item was" : `${n.skipped} items were`} already here and stayed as they are.` : "")
    + (n.failed ? ` ${n.failed === 1 ? "1 photo or voice note" : `${n.failed} photos and voice notes`} couldn't be saved; this device may be out of space.` : "");
}

// ---------- the app on the phone ----------
// Keeps the app's own files on the device so it opens offline (service workers need https:// or localhost).
const sw = "serviceWorker" in navigator && location.protocol !== "file:"
  ? navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => null) : Promise.resolve(null);
// An installed iPhone app is usually resumed rather than reopened, so the browser's own check for a new version
// (which comes with opening a page) rarely runs. Check when Glimmer comes back on screen, at most once an hour.
let checkedAt = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || Date.now() - checkedAt < 36e5) return;
  checkedAt = Date.now(); sw.then((reg) => reg?.update()).catch(() => {});
});
// The installed app asks the browser to keep its storage on every launch until it agrees.
if (installed) navigator.storage?.persisted?.().then((kept) => kept || navigator.storage.persist()).catch(() => {});

route();
</script>
</body>
</html>
